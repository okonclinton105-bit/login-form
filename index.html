<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of Calabar Result Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="login-card">
            <!-- Card Header with Gradient and Logo -->
            <div class="card-header">
                <!-- Add your image source below -->
                <img src="" alt="University Logo" class="uni-logo">
                <h2>UNIVERSITY OF CALABAR</h2>
                <p>RESULT PORTAL</p>
            </div>

            <!-- Form Section -->
            <div class="card-body">
                <form action="#">
                    <div class="form-group">
                        <label for="mat-num">MATRICULATION NUMBER</label>
                        <input type="text" id="mat-num" placeholder="e.g. CC/20/0001">
                    </div>

                    <div class="form-group">
                        <label for="jamb-num">JAMB REGISTRATION NUMBER</label>
                        <input type="text" id="jamb-num" placeholder="e.g. 12345678AB">
                    </div>

                    <div class="form-group">
                        <label for="pin">ACCESS PIN</label>
                        <input type="password" id="pin" placeholder="Enter your pin">
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary">NEW STUDENT</button>
                        <button type="button" class="btn-secondary">RETURNING</button>
                    </div>

                    <button type="submit" class="btn-primary">LOGIN</button>
                </form>

                <div class="card-footer-links">
                    <a href="#" class="text-cyan">Don't have a pin? Get one here</a>
                    <a href="#" class="text-gray">Change Pin</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Footer -->
    <footer class="page-footer">
        <span>Copyright &copy; 2026</span>
        <span>University Of Calabar Result Database Unit</span>
    </footer>
</body>
</html>
